<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title description">
  <title id="title">LocalFlow</title>
  <desc id="description">A black dynamic-island shape carrying a flowing red waveform beside the LocalFlow wordmark.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171316"/>
      <stop offset="1" stop-color="#080708"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F1424" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#E33B4B"/>
      <stop offset="0.72" stop-color="#FF5968"/>
      <stop offset="1" stop-color="#8F1424" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .wordmark { fill: #151216; }
    .tagline { fill: #7A7075; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #F5F1F3; }
      .tagline { fill: #A79DA2; }
    }
  </style>

  <g transform="translate(20 28)">
    <path d="M0 0h192c20 0 36 16 36 36v88c0 33-27 60-60 60H60c-33 0-60-27-60-60V0Z" fill="url(#shell)"/>
    <path d="M0 .5h228" stroke="#3A3035" stroke-opacity=".75"/>
    <path d="M22 92c18 0 20-25 38-25s20 48 38 48 20-72 38-72 20 59 38 59 20-23 38-23" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M22 92c18 0 20-13 38-13s20 24 38 24 20-36 38-36 20 30 38 30 20-12 38-12" fill="none" stroke="#F04A5A" stroke-opacity=".36" stroke-width="2" stroke-linecap="round"/>
    <circle cx="22" cy="92" r="3" fill="#E33B4B"/>
    <circle cx="212" cy="79" r="3" fill="#E33B4B"/>
  </g>

  <g transform="translate(286 65)">
    <text class="wordmark" x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="88" font-weight="650" letter-spacing="-4">LocalFlow</text>
    <rect x="4" y="103" width="500" height="2" rx="1" fill="url(#signal)"/>
    <text class="tagline" x="6" y="137" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" font-weight="600" letter-spacing="5">ON-DEVICE DICTATION FOR MACOS</text>
  </g>
</svg>
